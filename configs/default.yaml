# Argus Surveillance System - Default Configuration

camera:
  source: 0  # 0 for default webcam, or path/URL to video file or RTSP stream
  name: "camera_0"
  width: 1280
  height: 720
  fps: 30

inference:
  device: "auto"  # "auto", "cuda", or "cpu"
  half_precision: false

detection:
  model_name: "yolov8n.pt"
  confidence_threshold: 0.4
  iou_threshold: 0.45
  target_classes: [0]  # 0 = person in standard COCO models
  image_size: 640

tracking:
  track_thresh: 0.4
  match_thresh: 0.8
  track_buffer: 30
  min_box_area: 100.0

reid:
  model_name: "osnet_x0_25"
  similarity_threshold: 0.88
  reacquisition_threshold: 0.90
  reference_threshold: 0.85
  upper_threshold: 0.82
  min_margin: 0.05
  w_upper: 0.40
  w_color: 0.15
  w_deep: 0.35
  w_lower: 0.10
  extract_interval_frames: 5

  gallery_size: 6
  reference_samples: 4
  reference_window_frames: 30
  adaptive_gallery_size: 6
  min_crop_width: 24
  min_crop_height: 60
  min_sharpness: 25.0
  redundancy_threshold: 0.90
  temporal_window_size: 5
  reacquisition_min_frames: 5





visualization:
  show_window: true
  window_name: "Argus Surveillance"
  draw_fps: true
  draw_boxes: true
  draw_ids: true
  box_thickness: 2
  font_scale: 0.6

multi_camera:
  enabled: false
  graph_file: "configs/camera_graph.json"
  search:
    initial_radius: 1
    radius_increment: 1
    per_radius_timeout_s: 5.0
    max_radius: 3
    total_recovery_timeout_s: 30.0
    confirmation_frames: 3
    handoff_confirm_delay_s: 2.0

  ui_port: 8765

